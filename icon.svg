<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- A flat silhouette avoids fine detail at small desktop icon sizes. -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="#4F46E5"/>
  <!-- Front-facing parcel with a folded lid and a generous white face. -->
  <path d="M40 32H88L100 52V90C100 95.523 95.523 100 90 100H38C32.477 100 28 95.523 28 90V52Z" fill="#FFFFFF"/>
  <path d="M40 32H88L100 52H28Z" fill="#C7D2FE"/>
  <path d="M64 32V50" stroke="#818CF8" stroke-width="4"/>
  <!-- The install arrow is negative space within the package face. -->
  <path d="M64 64V85M54 75L64 85L74 75" fill="none" stroke="#4F46E5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
